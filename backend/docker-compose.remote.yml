services:
  iex-postgres:
    image: postgres:16-alpine
    container_name: iex-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: iex_sec_k9P2mX_2026
      POSTGRES_DB: Prolt_Operations
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Prolt_Operations"]
      interval: 5s
      timeout: 5s
      retries: 5


  iex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iex-backend
    restart: unless-stopped
    ports:
      - "5001:8080"
    depends_on:
      iex-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:iex_sec_k9P2mX_2026@iex-postgres:5432/Prolt_Operations}
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
    name: postgres_data
