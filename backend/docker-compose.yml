version: '3.8'

services:
  iex-postgres:
    image: postgres:17
    container_name: iex-postgres-${ENV_SUFFIX:-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Prolt_Operations}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Prolt_Operations}"]
      interval: 5s
      timeout: 5s
      retries: 5

  iex-postgres-backup:
    image: postgres:17
    container_name: iex-postgres-backup-${ENV_SUFFIX:-dev}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Prolt_Operations}
    volumes:
      - postgres_backup_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Prolt_Operations}"]
      interval: 5s
      timeout: 5s
      retries: 5

  iex-db-sync:
    image: postgres:17
    container_name: iex-db-sync-${ENV_SUFFIX:-dev}
    restart: unless-stopped
    depends_on:
      iex-postgres:
        condition: service_healthy
      iex-postgres-backup:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Prolt_Operations}
    entrypoint: |
      sh -c '
      echo "Starting database sync service..."
      while true; do
        echo "Syncing primary to backup database..."
        pg_dump -h iex-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F c -b -v -f /tmp/backup.dump
        if [ -f /tmp/backup.dump ]; then
          # Terminate existing connections to backup database to avoid conflicts
          psql -h iex-postgres-backup -U "$POSTGRES_USER" -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '\''$POSTGRES_DB'\'' AND pid <> pg_backend_pid();" || true
          # Recreate database in backup instance
          psql -h iex-postgres-backup -U "$POSTGRES_USER" -d postgres -c "DROP DATABASE IF EXISTS \"$POSTGRES_DB\";" || true
          psql -h iex-postgres-backup -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$POSTGRES_DB\";" || true
          pg_restore -h iex-postgres-backup -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v /tmp/backup.dump || true
          rm -f /tmp/backup.dump
          echo "Sync completed successfully. Sleeping for 10 minutes..."
        else
          echo "Failed to create pg_dump. Retrying in 30 seconds..."
          sleep 30
          continue
        fi
        sleep 600
      done
      '

  iex-migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: iex-migrator-${ENV_SUFFIX:-dev}
    depends_on:
      iex-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PRISMA_HIDE_UPDATE_MESSAGE=true
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@iex-postgres:5432/${POSTGRES_DB:-Prolt_Operations}?schema=public
    command: sh -c "npx prisma db push --accept-data-loss"

  iex-redis:
    image: redis:7-alpine
    container_name: iex-redis-${ENV_SUFFIX:-dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  iex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iex-backend-${ENV_SUFFIX:-dev}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      iex-postgres:
        condition: service_healthy
      iex-postgres-backup:
        condition: service_healthy
      iex-redis:
        condition: service_started
      iex-migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@iex-postgres:5432/${POSTGRES_DB:-Prolt_Operations}?schema=public
      - BACKUP_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@iex-postgres-backup:5432/${POSTGRES_DB:-Prolt_Operations}?schema=public
      - REDIS_URL=redis://iex-redis:6379
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
    name: postgres_data_${ENV_SUFFIX:-dev}
  postgres_backup_data:
    name: postgres_backup_data_${ENV_SUFFIX:-dev}
  redis_data:
    name: redis_data_${ENV_SUFFIX:-dev}
