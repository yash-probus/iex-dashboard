version: '3.8'

services:
  iex-postgres:
    image: postgres:16
    container_name: iex-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iex_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iex_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  iex-migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: iex-migrator
    depends_on:
      iex-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PRISMA_HIDE_UPDATE_MESSAGE=true
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@iex-postgres:5432/${POSTGRES_DB:-iex_dashboard}?schema=public
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && npx ts-node scripts/seed_tod_tariff.ts"

  iex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iex-backend
    restart: unless-stopped
    ports:
      - "5001:8080"
    depends_on:
      iex-postgres:
        condition: service_healthy
      iex-migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@iex-postgres:5432/${POSTGRES_DB:-iex_dashboard}?schema=public
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
    name: postgres_data
